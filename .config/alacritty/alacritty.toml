[general]
live_config_reload = true

[terminal.shell]
program = "/usr/bin/zsh"

[bell]
animation = "EaseOutExpo"
color = "#ffffff"
duration = 10

[bell.command]
args = ["bel"]
program = "tput"

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "0x44464d"
blue = "0x2561f7"
cyan = "0x029cb0"
green = "0x00e676"
magenta = "0x8349eb"
red = "0xf53122"
white = "0xFFFFFF"
yellow = "0xffeb3b"

[colors.normal]
black = "0x202124"
blue = "0x224ebd"
cyan = "0x00bcd4"
green = "0x00a655"
magenta = "0x673ab7"
red = "0xf44336"
white = "0xC4C4C4"
yellow = "0xdbca32"

[colors.primary]
background = "0x1A1A1A"
foreground = "0xFFFFFF"

[colors.selection]
background = "0x3465A4"
text = "0xFFFFFF"

[cursor]
style = "Block"
unfocused_hollow = true

[env]
TERM = "xterm-256color"

[font]
size = 11.0

[font.normal]
family = "UbuntuMono Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control"

[scrolling]
history = 100000
multiplier = 2

[window]
decorations = "full"
dynamic_padding = false
dynamic_title = true
opacity = 0.98

[window.dimensions]
columns = 150
lines = 48

[window.padding]
x = 4
y = 0

[window.position]
x = 1900
y = 1800
