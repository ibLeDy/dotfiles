repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Repository hygiene
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-new-submodules
      # Symlinks: the core invariant of this repo
      - id: check-symlinks
      - id: destroyed-symlinks
      # Executables and shebangs must agree, in both directions
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # .config/aliasrc is sourced, not executed: the shebang is there
        # only to give editors/shellcheck the right syntax mode.
        # .config/pulse/default.pa opens with "#!/usr/bin/pulseaudio -nF",
        # which is a Pulse directive, not a shebang: the file is loaded,
        # not executed.
        exclude: ^(\.config/aliasrc|\.config/pulse/default\.pa)$
      # Data formats
      - id: check-json
        exclude: .config/Code/User/settings.json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      # Whitespace and encoding
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      # Secrets
      - id: detect-private-key
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: text-unicode-replacement-char
  # Shell: the actual code in this repository
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # SC1090/SC1091: rc files source machine-local paths that do not
        # exist in this repo and cannot be followed. Inherent to dotfiles.
        args: ["--exclude=SC1090,SC1091"]  # quoted: YAML flow seqs split on commas
        # ShellCheck has no zsh support: it parses zsh as bash and reports
        # valid zsh syntax as errors. Excluded because the findings would be
        # false, not because they are inconvenient.
        exclude: |
          (?x)^(
            \.config/zsh/.*|
            \.config/spaceship/spaceship\.zsh
          )$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [--indent=4, --case-indent, --binary-next-line]
  # Broad secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
